mutation SceneCreate($input: SceneCreateInput!) {
  sceneCreate(input: $input) {
    ...SceneData
  }
}

mutation SceneUpdate($input: SceneUpdateInput!) {
  sceneUpdate(input: $input) {
    ...SceneUpdateData
  }
}

# CUSTOM: lightweight path for the toolbar Organized toggle.
mutation SceneOrganizedUpdate($input: SceneUpdateInput!) {
  sceneUpdate(input: $input) {
    id
    organized
    updated_at
  }
}

# CUSTOM: keep edit saves complete enough to repaint edited metadata without
# re-resolving markers, histories, files, releases, and other heavyweight data.
fragment SceneUpdateData on Scene {
  id
  title
  code
  details
  director
  urls
  date
  effective_date
  rating100
  organized
  updated_at
  custom_fields
  paths {
    screenshot
  }
  direct_galleries {
    id
    title
    files {
      path
    }
    folder {
      path
    }
    paths {
      cover
      preview
    }
  }
  galleries {
    id
    title
    files {
      path
    }
    folder {
      path
    }
    paths {
      cover
      preview
    }
  }
  studio {
    ...SlimStudioData
  }
  groups {
    group {
      id
      name
      front_image_path
    }
    scene_index
  }
  tags {
    id
    name
    sort_name
    image_path
  }
  performers {
    id
    name
    disambiguation
    gender
    country
    favorite
    image_path
    birthdate
    rating100
    rating_tier_tags: tags {
      id
    }
  }
  stash_ids {
    endpoint
    stash_id
    updated_at
  }
}

mutation BulkSceneUpdate($input: BulkSceneUpdateInput!) {
  bulkSceneUpdate(input: $input) {
    # CUSTOM: keep bulk edit responses lightweight; callers refetch impacted lists.
    id
  }
}

mutation ScenesUpdate($input: [SceneUpdateInput!]!) {
  scenesUpdate(input: $input) {
    ...SceneData
  }
}

mutation SceneSaveActivity(
  $id: ID!
  $resume_time: Float
  $playDuration: Float
) {
  sceneSaveActivity(
    id: $id
    resume_time: $resume_time
    playDuration: $playDuration
  )
}

mutation SceneResetActivity(
  $id: ID!
  $reset_resume: Boolean!
  $reset_duration: Boolean!
) {
  sceneResetActivity(
    id: $id
    reset_resume: $reset_resume
    reset_duration: $reset_duration
  )
}

mutation SceneAddPlay($id: ID!, $times: [Timestamp!]) {
  sceneAddPlay(id: $id, times: $times) {
    count
  }
}

mutation SceneDeletePlay($id: ID!, $times: [Timestamp!]) {
  sceneDeletePlay(id: $id, times: $times) {
    count
  }
}

mutation SceneResetPlayCount($id: ID!) {
  sceneResetPlayCount(id: $id)
}

mutation SceneAddO($id: ID!, $times: [Timestamp!]) {
  sceneAddO(id: $id, times: $times) {
    count
  }
}

mutation SceneDeleteO($id: ID!, $times: [Timestamp!]) {
  sceneDeleteO(id: $id, times: $times) {
    count
  }
}

mutation SceneResetO($id: ID!) {
  sceneResetO(id: $id)
}

mutation SceneDestroy(
  $id: ID!
  $delete_file: Boolean
  $delete_generated: Boolean
) {
  sceneDestroy(
    input: {
      id: $id
      delete_file: $delete_file
      delete_generated: $delete_generated
    }
  )
}

mutation ScenesDestroy(
  $ids: [ID!]!
  $delete_file: Boolean
  $delete_generated: Boolean
) {
  scenesDestroy(
    input: {
      ids: $ids
      delete_file: $delete_file
      delete_generated: $delete_generated
    }
  )
}

mutation SceneGenerateScreenshot($id: ID!, $at: Float) {
  sceneGenerateScreenshot(id: $id, at: $at)
}

mutation SceneAssignFile($input: AssignSceneFileInput!) {
  sceneAssignFile(input: $input)
}

# CUSTOM: begin
mutation SaveSceneMultiSegmentLoopPreset(
  $input: SceneMultiSegmentLoopPresetInput!
) {
  saveSceneMultiSegmentLoopPreset(input: $input) {
    id
    scene_id
    name
    enabled
    current_segment_index
    segments {
      start
      end
    }
    created_at
    updated_at
  }
}

mutation DeleteSceneMultiSegmentLoopPreset($scene_id: ID!, $name: String!) {
  deleteSceneMultiSegmentLoopPreset(scene_id: $scene_id, name: $name)
}

mutation SceneNegativeMarkerCreate($input: SceneNegativeMarkerCreateInput!) {
  sceneNegativeMarkerCreate(input: $input) {
    id
    scene_id
    name
    start_seconds
    end_seconds
    created_at
    updated_at
  }
}

mutation SceneNegativeMarkerUpdate($input: SceneNegativeMarkerUpdateInput!) {
  sceneNegativeMarkerUpdate(input: $input) {
    id
    scene_id
    name
    start_seconds
    end_seconds
    created_at
    updated_at
  }
}

mutation SceneNegativeMarkerDestroy($id: ID!) {
  sceneNegativeMarkerDestroy(id: $id)
}
