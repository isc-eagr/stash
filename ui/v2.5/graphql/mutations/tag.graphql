mutation TagCreate($input: TagCreateInput!) {
  tagCreate(input: $input) {
    ...TagData
  }
}

mutation TagDestroy($id: ID!) {
  tagDestroy(input: { id: $id })
}

mutation TagsDestroy($ids: [ID!]!) {
  tagsDestroy(ids: $ids)
}

mutation TagUpdate($input: TagUpdateInput!) {
  tagUpdate(input: $input) {
    ...TagData
  }
}

mutation BulkTagUpdate($input: BulkTagUpdateInput!) {
  bulkTagUpdate(input: $input) {
    # CUSTOM: keep bulk edit responses lightweight; callers refetch impacted lists.
    id
  }
}

mutation TagsMerge(
  $source: [ID!]!
  $destination: ID!
  $values: TagUpdateInput
) {
  tagsMerge(
    input: { source: $source, destination: $destination, values: $values }
  ) {
    ...TagData
  }
}
