mutation SceneMarkerCreate(
  $title: String!
  $seconds: Float!
  $end_seconds: Float
  $scene_id: ID!
  $primary_tag_id: ID!
  $tag_ids: [ID!] = []
  $top_performer_ids: [ID!] = [] # CUSTOM
  $bottom_performer_ids: [ID!] = [] # CUSTOM
) {
  sceneMarkerCreate(
    input: {
      title: $title
      seconds: $seconds
      end_seconds: $end_seconds
      scene_id: $scene_id
      primary_tag_id: $primary_tag_id
      tag_ids: $tag_ids
      top_performer_ids: $top_performer_ids # CUSTOM
      bottom_performer_ids: $bottom_performer_ids # CUSTOM
    }
  ) {
    ...SceneMarkerMutationData # CUSTOM: omit the nested scene graph from save responses
  }
}

mutation SceneMarkerUpdate(
  $id: ID!
  $title: String!
  $seconds: Float!
  $end_seconds: Float
  $scene_id: ID!
  $primary_tag_id: ID!
  $tag_ids: [ID!] = []
  $top_performer_ids: [ID!] = [] # CUSTOM
  $bottom_performer_ids: [ID!] = [] # CUSTOM
) {
  sceneMarkerUpdate(
    input: {
      id: $id
      title: $title
      seconds: $seconds
      end_seconds: $end_seconds
      scene_id: $scene_id
      primary_tag_id: $primary_tag_id
      tag_ids: $tag_ids
      top_performer_ids: $top_performer_ids # CUSTOM
      bottom_performer_ids: $bottom_performer_ids # CUSTOM
    }
  ) {
    ...SceneMarkerMutationData # CUSTOM: omit the nested scene graph from save responses
  }
}

mutation BulkSceneMarkerUpdate($input: BulkSceneMarkerUpdateInput!) {
  bulkSceneMarkerUpdate(input: $input) {
    # CUSTOM: keep bulk edit responses lightweight; callers refetch impacted lists.
    id
  }
}

mutation SceneMarkerDestroy($id: ID!) {
  sceneMarkerDestroy(id: $id)
}

mutation SceneMarkersDestroy($ids: [ID!]!) {
  sceneMarkersDestroy(ids: $ids)
}

# CUSTOM: marker saves only need the marker and its direct relationships. The
# full SceneMarkerData fragment recursively fetches scene files and performers.
fragment SceneMarkerMutationData on SceneMarker {
  id
  created_at
  updated_at
  title
  seconds
  end_seconds
  stream
  preview
  screenshot
  primary_tag {
    id
    name
    parents {
      id
      name
    }
  }
  tags {
    id
    name
    parents {
      id
      name
    }
  }
  performers {
    id
    name
    alias_list
    disambiguation
  }
  top_performers {
    id
    name
    alias_list
    disambiguation
    image_path
  }
  bottom_performers {
    id
    name
    alias_list
    disambiguation
    image_path
  }
}
