# Light fragment used by list pages and cards (no depth variants) # CUSTOM
fragment StudioData on Studio {
  id
  name
  url
  urls
  parent_studio {
    id
    name
    url
    urls
    image_path
  }
  child_studios {
    id
    name
    image_path
  }
  ignore_auto_tag
  organized
  image_path
  scene_count
  # CUSTOM: begin
  studio_role_counts { # CUSTOM: batched - replaces individual sex/oral/solo/facial_scene_count fields
    sex_scene_count
    oral_scene_count
    solo_scene_count
    facial_scene_count
  }
  unique_performer_count
  # CUSTOM: end
  image_count
  gallery_count
  performer_count
  group_count
  stash_ids {
    stash_id
    endpoint
    updated_at
  }
  details
  rating100
  favorite
  aliases
  tags {
    ...SlimTagData
  }
  o_counter
  custom_fields
}

# CUSTOM: begin
# Full fragment used by studio detail page (includes depth/child-studio counts)
fragment StudioDetailData on Studio {
  ...StudioData
  scene_count_all: scene_count(depth: -1)
  studio_role_counts_all: studio_role_counts(depth: -1) { # CUSTOM: batched depth=-1 counts
    sex_scene_count
    oral_scene_count
    solo_scene_count
    facial_scene_count
  }
  unique_performer_count_all: unique_performer_count(depth: -1)
  image_count_all: image_count(depth: -1)
  gallery_count_all: gallery_count(depth: -1)
  performer_count_all: performer_count(depth: -1)
  group_count_all: group_count(depth: -1)
}
# CUSTOM: end

fragment SelectStudioData on Studio {
  id
  name
  aliases
  details
  image_path

  parent_studio {
    id
    name
  }
}
