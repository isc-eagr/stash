fragment ImageData on Image {
  id
  title
  code
  rating100
  date
  urls
  details
  photographer
  organized
  o_counter
  created_at
  updated_at

  paths {
    thumbnail
    preview
    image
  }

  galleries {
    ...SelectGalleryData # CUSTOM: image links and editor need selection fields only
  }

  studio {
    ...SlimStudioData
  }

  tags {
    ...SlimTagData
  }

  performers {
    ...PerformerListData # CUSTOM: card role totals load in one batch
    # CUSTOM: retain exact marker badge counts used before batching.
    facial_marker_top_count
    facial_marker_bottom_count
    feet_marker_count
  }

  visual_files {
    ...VisualFileData
  }

  custom_fields
}
