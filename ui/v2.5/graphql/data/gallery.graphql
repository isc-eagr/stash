fragment GalleryData on Gallery {
  id
  created_at
  updated_at
  title
  code
  date
  urls
  details
  photographer
  rating100
  organized

  paths {
    cover
    preview
  }

  files {
    ...GalleryFileData
  }
  folder {
    ...FolderData
  }
  image_count
  chapters {
    ...GalleryChapterData
  }
  studio {
    ...SlimStudioData
  }
  tags {
    ...SlimTagData
  }

  performers {
    ...PerformerListData # CUSTOM: card role totals load in one batch
    # CUSTOM: retain exact marker badge counts used before batching.
    facial_marker_top_count
    facial_marker_bottom_count
    feet_marker_count
  }
  scenes {
    ...SlimSceneData
  }

  custom_fields
}

fragment SelectGalleryData on Gallery {
  id
  title
  date
  code
  studio {
    name
  }
  cover {
    paths {
      thumbnail
    }
  }
  paths {
    preview
  }
  files {
    path
  }
  folder {
    path
  }
}
