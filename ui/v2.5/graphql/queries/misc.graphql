query MarkerStrings($q: String, $sort: String) {
  markerStrings(q: $q, sort: $sort) {
    id
    count
    title
  }
}

query Stats {
  stats {
    scene_count
    scenes_size
    scenes_duration
    image_count
    images_size
    gallery_count
    performer_count
    studio_count
    group_count
    tag_count
    total_o_count
    total_play_duration
    total_play_count
    scenes_played
    sex_scene_count
    oral_scene_count
    solo_scene_count
    facial_scene_count
  }
}

query Logs {
  logs {
    ...LogEntryData
  }
}
query Version {
  version {
    version
    hash
    build_time
  }
}

query LatestVersion {
  latestversion {
    version
    shorthash
    release_date
    url
  }
}

# Distinct performer ethnicities for filters
query PerformerEthnicities {
  performerEthnicities
}

# Performers by ethnicity for Stats page
query PerformerEthnicityCounts {
  performerEthnicityCounts {
    ethnicity
    count
  }
}

# 5-star performers by ethnicity for Stats page
query PerformerEthnicityFiveStarCounts {
  performerEthnicityFiveStarCounts {
    ethnicity
    count
  }
}
