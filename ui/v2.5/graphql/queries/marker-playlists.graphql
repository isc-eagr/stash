query FindMarkerPlaylists {
  findMarkerPlaylists {
    id
    name
    marker_ids
    created_at
    updated_at
  }
}

mutation MarkerPlaylistCreate($input: MarkerPlaylistCreateInput!) {
  markerPlaylistCreate(input: $input) {
    id
    name
    marker_ids
    created_at
    updated_at
  }
}

mutation MarkerPlaylistDestroy($id: ID!) {
  markerPlaylistDestroy(id: $id)
}
