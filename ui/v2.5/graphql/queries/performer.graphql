query FindPerformers(
  $filter: FindFilterType
  $performer_filter: PerformerFilterType
  $performer_ids: [Int!]
) {
  findPerformers(
    filter: $filter
    performer_filter: $performer_filter
    performer_ids: $performer_ids
  ) {
    count
    performers {
      ...PerformerData
    }
  }
}

query FindPerformer($id: ID!) {
  findPerformer(id: $id) {
    ...PerformerData
  }
}

query FindPerformersForSelect(
  $filter: FindFilterType
  $performer_filter: PerformerFilterType
  $ids: [ID!]
) {
  findPerformers(
    filter: $filter
    performer_filter: $performer_filter
    ids: $ids
  ) {
    count
    performers {
      ...SelectPerformerData
    }
  }
}

query PerformerCoPerformersByRole($performer_id: ID!) {
  performerCoPerformersByRole(performer_id: $performer_id) {
    sex_as_giver {
      ...PerformerData
    }
    sex_as_receiver {
      ...PerformerData
    }
    oral_as_giver {
      ...PerformerData
    }
    oral_as_receiver {
      ...PerformerData
    }
    facial_as_giver {
      ...PerformerData
    }
    facial_as_receiver {
      ...PerformerData
    }
    unique_count
  }
}
