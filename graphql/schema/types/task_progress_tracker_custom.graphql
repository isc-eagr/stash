# CUSTOM: Database-backed task progress trackers.

type TaskProgressTracker {
  id: ID!
  title: String!
  description: String!
  goal: Int!
  tag_id: ID!
  tag_name: String!
  position: Int!
  is_working_on: Boolean!
  "Calendar date the task was started, formatted as YYYY-MM-DD"
  started_on: String!
  created_at: Time!
  updated_at: Time!
}

input TaskProgressTrackerCreateInput {
  title: String!
  description: String!
  tag_id: ID!
  "Optional calendar date in YYYY-MM-DD or DD/MM/YYYY format; defaults to the creation date"
  started_on: String
}

input TaskProgressTrackerUpdateInput {
  id: ID!
  title: String
  description: String
  tag_id: ID
  reset_goal: Boolean
  is_working_on: Boolean
  "Calendar date in YYYY-MM-DD or DD/MM/YYYY format"
  started_on: String
}
