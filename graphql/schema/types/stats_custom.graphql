# CUSTOM: All custom Stats fields, types, and queries.
# This file uses 'extend type' to add fields to the upstream StatsResultType
# without modifying the upstream stats.graphql file.
# See CUSTOM_FEATURES.md for documentation.

extend type StatsResultType {
  sex_scene_count: Int!
  oral_scene_count: Int!
  solo_scene_count: Int!
  facial_scene_count: Int!
}

"Count of performers grouped by ethnicity"
type PerformerEthnicityCount {
  ethnicity: String!
  count: Int!
}

"Count of performers grouped by ethnicity and rating-card tier"
type PerformerEthnicityTierCount {
  ethnicity: String!
  bronze: Int!
  silver: Int!
  gold: Int!
  royal_sapphire: Int!
}

"Count of scene orgasm events grouped by year"
type SceneOYearCount {
  year: Int!
  count: Int!
}

# CUSTOM: begin
"Count of scene O events grouped by month within a year"
type SceneOMonthCount {
  year: Int!
  month: Int!
  count: Int!
}

"Count of scene O events grouped by day within a month"
type SceneODayCount {
  date: String!
  day: Int!
  count: Int!
}

"A single recorded scene O event for the hidden O stats timeline"
type SceneOEvent {
  id: ID!
  scene_id: ID!
  o_date: String!
  video_timestamp: Float
  "Primary and secondary marker tags associated with the O timestamp"
  associated_tags: [Tag!]!
  scene: Scene!
}
# CUSTOM: end

"Highest count of scene O events on a single date"
type SceneODayStat {
  date: String!
  count: Int!
}

"Longest date range between scene O events"
type SceneODrySpell {
  days: Int!
  start_date: String!
  end_date: String!
}

# CUSTOM: begin
"Count of timestamped scene O events grouped by marker tag at that timestamp"
type SceneOCountByTag {
  tag_id: ID!
  tag_name: String!
  count: Int!
}

"Count of scene O events grouped by associated vato ethnicity"
type SceneOCountByEthnicity {
  ethnicity: String!
  count: Int!
}

"Count of scene O events grouped by associated vato country"
type SceneOCountByCountry {
  country: String!
  count: Int!
}

"Count of scene O events grouped by scene studio"
type SceneOCountByStudio {
  studio_id: ID!
  studio_name: String!
  count: Int!
}

"Scene-studio O counts, including O events without a studio"
type SceneOCountsByStudio {
  counts: [SceneOCountByStudio!]!
  unknown_count: Int!
}

"Count of scene O events grouped by a vato's age at the scene's effective release date"
type SceneOCountByPerformerAge {
  age: Int!
  count: Int!
}

"Performer-age O counts, including O events without a usable performer age"
type SceneOCountsByPerformerAge {
  counts: [SceneOCountByPerformerAge!]!
  unknown_count: Int!
}

"Count of scene O events grouped by the scene's effective release year"
type SceneOCountByReleaseYear {
  year: Int!
  count: Int!
}

"Scene-release-year O counts, including O events without an effective release date"
type SceneOCountsByReleaseYear {
  counts: [SceneOCountByReleaseYear!]!
  unknown_count: Int!
}

"Tag IDs associated with one scene marker for compact SceneStats data"
type SceneStatsMarkerTagGroup {
  tag_ids: [ID!]!
}

"Compact per-scene data used by the SceneStats page"
type SceneStatsScene {
  id: ID!
  title: String
  date: String
  effective_date: String
  rating100: Int
  o_counter: Int!
  o_counter_past_year: Int!
  is_past_year: Boolean!
  is_release_past_year: Boolean!
  duration: Float!
  filesize: Float!
  performer_count: Int!
  performer_count_past_year: Int!
  performer_ethnicities: [String!]!
  performer_countries: [String!]!
  marker_tag_groups: [SceneStatsMarkerTagGroup!]!
  tag_ids: [ID!]!
  primary_width: Int
  primary_height: Int
  most_recent_o_date: String
}

"Compact SceneStats dataset returned without per-scene GraphQL relationship resolution"
type SceneStatsResult {
  count: Int!
  scenes: [SceneStatsScene!]!
}

"Exact scene-age count for a vato on the Vato Stats page"
type VatoStatsAgeCount {
  age_range: String!
  count: Int!
}

"Per-vato aggregate row used by the Vato Stats page"
type VatoStatsPerformer {
  id: ID!
  name: String!
  image_path: String
  rating100: Int
  scene_o_count: Int!
  scene_o_count_past_year: Int!
  is_past_year: Boolean!
  scene_count: Int!
  sex_top_count: Int!
  sex_bottom_count: Int!
  oral_top_count: Int!
  oral_bottom_count: Int!
  solo_scene_count: Int!
  facial_given_count: Int!
  facial_received_count: Int!
  most_recent_o_date: String
  career_span_days: Int!
  metallic_rating: String
  ethnicity: String
  country: String
  hair_color: String
  eye_color: String
  height_cm: Int
  penis_length: Float
  circumcised: String
  age_counts: [VatoStatsAgeCount!]!
  unknown_scene_age_count: Int!
}
# CUSTOM: end

extend type Query {
  "Get compact per-scene data for the SceneStats dashboard, optionally scoped to a studio tree"
  sceneStats(studio_id: ID, depth: Int): SceneStatsResult!
  "Get activity and quality duration stats for SceneStats, optionally scoped to a studio tree"
  sceneStatsActivity(studio_id: ID, depth: Int): StudioActivityStats!
  "Get scene and performer Rating Advisor averages, optionally scoped to a studio tree"
  globalRatingAdvisorStats(studio_id: ID, depth: Int): StudioRatingAdvisorStats!
  "Get scene Rating Advisor averages for scenes containing one performer"
  performerRatingAdvisorStats(performer_id: ID!): StudioRatingAdvisorStats!
  "Get a count of performers per ethnicity (non-empty only), sorted by highest count first"
  performerEthnicityCounts: [PerformerEthnicityCount!]!
  "Get a count of 5-star performers per ethnicity (non-empty only), sorted by highest count first"
  performerEthnicityFiveStarCounts: [PerformerEthnicityCount!]!
  "Get performer rating-tier counts per ethnicity (non-empty only), sorted by highest tier total first"
  performerEthnicityTierCounts: [PerformerEthnicityTierCount!]!
  "Get a count of scene orgasm events grouped by year (ascending by year)"
  sceneOYearCounts: [SceneOYearCount!]!
  # CUSTOM: begin
  "Get recorded scene O events grouped by month for a year"
  sceneOMonthCounts(year: Int!): [SceneOMonthCount!]!
  "Get recorded scene O events grouped by day for a year/month"
  sceneODayCounts(year: Int!, month: Int!): [SceneODayCount!]!
  "Get recorded scene O events on a date, ordered chronologically"
  sceneOEventsByDate(date: String!): [SceneOEvent!]!
  "Get recorded scene O events covered by a marker tag, ordered chronologically"
  sceneOEventsByTag(tagID: ID!): [SceneOEvent!]!
  "Get the count of recorded scene O events without a timestamp-covered marker tag"
  sceneOCountWithoutMarkerTags: Int!
  "Get recorded scene O events without a timestamp-covered marker tag"
  sceneOEventsWithoutMarkerTags: [SceneOEvent!]!
  "Get recorded scene O events associated with a vato, ordered chronologically"
  sceneOEventsByPerformer(performerID: ID!): [SceneOEvent!]!
  # CUSTOM: end
  "Get the date with the highest number of recorded scene O events"
  mostOsInDay: SceneODayStat
  "Get the longest period without a recorded scene O event"
  longestPeriodWithoutO: SceneODrySpell
  "Get timestamped scene O events grouped by marker primary and secondary tags covering the O timestamp"
  sceneOCountsByTag: [SceneOCountByTag!]!
  "Get scene O events grouped by associated vato ethnicity"
  sceneOCountsByEthnicity: [SceneOCountByEthnicity!]!
  "Get recorded scene O events associated with a vato ethnicity"
  sceneOEventsByEthnicity(ethnicity: String!): [SceneOEvent!]!
  "Get scene O events grouped by associated vato country"
  sceneOCountsByCountry: [SceneOCountByCountry!]!
  "Get recorded scene O events associated with a vato country"
  sceneOEventsByCountry(country: String!): [SceneOEvent!]!
  "Get scene O events grouped by scene studio"
  sceneOCountsByStudio: SceneOCountsByStudio!
  "Get recorded scene O events for a scene studio"
  sceneOEventsByStudio(studioID: ID!): [SceneOEvent!]!
  "Get recorded scene O events whose scene has no studio"
  sceneOEventsWithUnknownStudio: [SceneOEvent!]!
  "Get scene O events grouped by performer age at the scene's effective release date"
  sceneOCountsByPerformerAge: SceneOCountsByPerformerAge!
  "Get recorded scene O events associated with a performer age at the scene's effective release date"
  sceneOEventsByPerformerAge(age: Int!): [SceneOEvent!]!
  "Get scene O events without a usable performer age at the scene's effective release date"
  sceneOEventsWithUnknownPerformerAge: [SceneOEvent!]!
  "Get scene O events grouped by the scene's effective release year"
  sceneOCountsByReleaseYear: SceneOCountsByReleaseYear!
  "Get recorded scene O events for a scene effective release year"
  sceneOEventsByReleaseYear(year: Int!): [SceneOEvent!]!
  "Get scene O events without an effective release date"
  sceneOEventsWithUnknownReleaseYear: [SceneOEvent!]!
  "Get the count of recorded O events whose date predates reliable O-date tracking"
  sceneOUnreliableDateCount: Int!
  "Get recorded O events whose date predates reliable O-date tracking"
  sceneOEventsBeforeTrackingStart: [SceneOEvent!]!
  "Get per-vato aggregate data for the Vato Stats page, optionally scoped to a studio tree"
  vatoStatsPerformers(studio_id: ID, depth: Int): [VatoStatsPerformer!]!
  "Get total number of 'orgasm' marker-tag entries, optionally scoped to a studio tree"
  sceneOrgasmCount(studio_id: ID, depth: Int): Int!
  "Get total number of facial markers (primary or secondary), optionally scoped to a studio tree. Includes descendants of 'facial'."
  sceneFacialCount(studio_id: ID, depth: Int): Int!
  "Get number of performers who have given facials (based on roleTagIds.facialTagId)"
  performersFacialGivenCount: Int!
  "Get number of performers who have received facials (based on roleTagIds.facialTagId)"
  performersFacialReceivedCount: Int!
  "Get number of performers who topped sexually (at least 1 sex marker as top)"
  performersSexGivenCount: Int!
  "Get number of performers who bottomed sexually (at least 1 sex marker as bottom)"
  performersSexReceivedCount: Int!
  "Get number of performers who topped orally (at least 1 oral marker as top)"
  performersOralGivenCount: Int!
  "Get number of performers who bottomed orally (at least 1 oral marker as bottom)"
  performersOralReceivedCount: Int!
  "Get number of strict tops (have top/oraltop, no bottom/oralbottom tags)"
  performersStrictTopCount: Int!
  "Get number of strict bottoms (have bottom/oralbottom, no top/oraltop tags)"
  performersStrictBottomCount: Int!
  "Get number of lenient tops (have top/oraltop, no bottom tag)"
  performersLenientTopCount: Int!
  "Get number of lenient bottoms (have bottom/oralbottom, no top tag)"
  performersLenientBottomCount: Int!
  "Get number of performers with only the solo tag"
  performersSoloOnlyCount: Int!
  "Get number of performers with only one scene"
  performersOneSceneCount: Int!
  "Get estimated liters produced from orgasms (orgasm count × 3ml)"
  estimatedLiters: Float!
  "Get total meters of combined penis lengths (default 17cm if missing, converted to meters)"
  totalPenisMeters: Float!
  "Get total time (in seconds) of orgasm markers, optionally scoped to a studio tree. Uses 20s default if no end time."
  totalOrgasmTime(studio_id: ID, depth: Int): Float!
  "Get total time (in seconds) of facial markers, optionally scoped to a studio tree. Uses 20s default if no end time."
  totalFacialTime(studio_id: ID, depth: Int): Float!
  "Get total time (in seconds) of completed sex activity markers, optionally scoped to a studio tree."
  totalSexTime(studio_id: ID, depth: Int): Float!
  "Get total time (in seconds) of completed oral activity markers, optionally scoped to a studio tree."
  totalOralTime(studio_id: ID, depth: Int): Float!
}
