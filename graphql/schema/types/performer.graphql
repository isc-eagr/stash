enum GenderEnum {
  MALE
  FEMALE
  TRANSGENDER_MALE
  TRANSGENDER_FEMALE
  INTERSEX
  NON_BINARY
}

enum CircumisedEnum {
  CUT
  UNCUT
}

type Performer {
  id: ID!
  name: String!
  disambiguation: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  gender: GenderEnum
  twitter: String @deprecated(reason: "Use urls")
  instagram: String @deprecated(reason: "Use urls")
  birthdate: String
  ethnicity: String
  country: String
  eye_color: String
  height_cm: Int
  measurements: String
  fake_tits: String
  penis_length: Float
  circumcised: CircumisedEnum
  career_length: String
  tattoos: String
  piercings: String
  alias_list: [String!]!
  favorite: Boolean!
  tags: [Tag!]!
  # Scene-scoped performer tags (tags for this performer within a specific scene)
  scene_tags(scene_id: ID!): [Tag!]!
  ignore_auto_tag: Boolean!

  image_path: String # Resolver
  scene_count: Int! # Resolver
  image_count: Int! # Resolver
  gallery_count: Int! # Resolver
  group_count: Int! # Resolver
  movie_count: Int! @deprecated(reason: "use group_count instead") # Resolver
  performer_count: Int! # Resolver
  o_counter: Int # Resolver
  sex_scene_count(top_tag: String, bottom_tag: String): Int! # Resolver - scenes with top/bottom tags
  oral_scene_count(oral_top_tag: String, oral_bottom_tag: String, top_tag: String, bottom_tag: String): Int! # Resolver - scenes with oral tags but not top/bottom
  solo_scene_count(solo_tag: String, top_tag: String, bottom_tag: String, oral_top_tag: String, oral_bottom_tag: String): Int! # Resolver - scenes with solo tags but not top/bottom/oral
  facial_scene_count(facial_given_tag: String, facial_received_tag: String): Int! # Resolver - scenes with facialgiven or facialreceived tags
  scenes: [Scene!]!
  stash_ids: [StashID!]!
  # rating expressed as 1-100
  rating100: Int
  details: String
  death_date: String
  hair_color: String
  weight: Int
  created_at: Time!
  updated_at: Time!
  groups: [Group!]!
  movies: [Movie!]! @deprecated(reason: "use groups instead")

  custom_fields: Map!
}

