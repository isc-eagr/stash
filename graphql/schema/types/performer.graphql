enum GenderEnum {
  MALE
  FEMALE
  TRANSGENDER_MALE
  TRANSGENDER_FEMALE
  INTERSEX
  NON_BINARY
}

enum CircumisedEnum {
  CUT
  UNCUT
}

type Performer {
  id: ID!
  name: String!
  disambiguation: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  gender: GenderEnum
  twitter: String @deprecated(reason: "Use urls")
  instagram: String @deprecated(reason: "Use urls")
  birthdate: String
  ethnicity: String
  country: String
  eye_color: String
  height_cm: Int
  measurements: String
  fake_tits: String
  penis_length: Float
  circumcised: CircumisedEnum
  career_length: String
  tattoos: String
  piercings: String
  alias_list: [String!]!
  favorite: Boolean!
  tags: [Tag!]!
  
  # Scene-context marker roles: returns this performer's roles in a specific scene's markers
  # Returns array of role strings: "sex_giver", "sex_receiver", "oral_giver", "oral_receiver", "facial_giver", "facial_receiver", "solo"
  scene_marker_roles(scene_id: ID!): [String!]!
  
  ignore_auto_tag: Boolean!

  image_path: String # Resolver
  scene_count: Int! # Resolver
  image_count: Int! # Resolver
  gallery_count: Int! # Resolver
  group_count: Int! # Resolver
  movie_count: Int! @deprecated(reason: "use group_count instead") # Resolver
  performer_count: Int! # Resolver
  o_counter: Int # Resolver
  
  # Role-based scene counts from scene_marker_performers
  # Sex scenes: scenes with markers having the configured sex tag
  sex_scene_count: Int! # Resolver - total sex scenes
  sex_giver_count: Int! # Resolver - sex scenes where performer is giver (top)
  sex_receiver_count: Int! # Resolver - sex scenes where performer is receiver (bottom)
  
  # Oral scenes: scenes with oral markers but no sex markers  
  oral_scene_count: Int! # Resolver - total oral scenes (excludes sex scenes)
  oral_giver_count: Int! # Resolver - oral scenes where performer is giver
  oral_receiver_count: Int! # Resolver - oral scenes where performer is receiver
  
  # Solo scenes: scenes with solo markers but no sex/oral markers
  solo_scene_count: Int! # Resolver - total solo scenes
  
  # Facial scenes: scenes with facial markers (independent of other markers)
  facial_scene_count: Int! # Resolver - total facial scenes
  facial_giver_count: Int! # Resolver - facial scenes where performer is giver
  facial_receiver_count: Int! # Resolver - facial scenes where performer is receiver
  
  scenes: [Scene!]!
  stash_ids: [StashID!]!
  # rating expressed as 1-100
  rating100: Int
  details: String
  death_date: String
  hair_color: String
  weight: Int
  created_at: Time!
  updated_at: Time!
  groups: [Group!]!
  movies: [Movie!]! @deprecated(reason: "use groups instead")

  custom_fields: Map!
}

