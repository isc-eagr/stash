type FindPerformersResultType {
  count: Int!
  performers: [Performer!]!
}

"Co-performers grouped by their role relationship to a performer"
type PerformerCoPerformersByRole {
  "Performers who were receivers when this performer was giver in sex scenes"
  sex_as_giver: [Performer!]!
  "Performers who were givers when this performer was receiver in sex scenes"
  sex_as_receiver: [Performer!]!
  "Performers who were receivers when this performer was giver in oral scenes"
  oral_as_giver: [Performer!]!
  "Performers who were givers when this performer was receiver in oral scenes"
  oral_as_receiver: [Performer!]!
  "Performers who were receivers when this performer was giver in facial scenes"
  facial_as_giver: [Performer!]!
  "Performers who were givers when this performer was receiver in facial scenes"
  facial_as_receiver: [Performer!]!
  "Total count of unique co-performers across all roles"
  unique_count: Int!
}

extend type Query {
  "Get co-performers grouped by their role relationship to the given performer"
  performerCoPerformersByRole(performer_id: ID!): PerformerCoPerformersByRole!
}
