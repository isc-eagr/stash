"A bounded page of recorded O events, newest first."
type SceneOEventPage {
  count: Int!
  page: Int!
  events: [SceneOEvent!]!
}

"One dated O, for combining O Stats with another instance."
type SceneOEventMoment {
  "UTC time, comparable across instances"
  at: String!
  "Local calendar day, as the O date charts use"
  day: String!
}

extend type Query {
  "Recorded O events across the library or studio scope, filtered by O date."
  sceneOEvents(
    page: Int! = 1
    per_page: Int! = 25
    studio_id: ID
    depth: Int
    date_range: StatsDateRangeInput
    "Skip this many events instead of whole pages"
    offset: Int
  ): SceneOEventPage!
  "Every dated O in scope, newest first in the sceneOEvents order."
  sceneOEventMoments(
    studio_id: ID
    depth: Int
    date_range: StatsDateRangeInput
  ): [SceneOEventMoment!]!
}
