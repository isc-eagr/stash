# CUSTOM: All custom Studio fields.
# This file uses 'extend type' to add NEW fields to the upstream Studio type.
# NOTE: Some upstream Studio fields have modified signatures (added performer_id parameter)
# that must remain as inline changes in studio.graphql marked with # CUSTOM comments.
# See CUSTOM_FEATURES.md for documentation.

extend type Studio {
  # Role-based scene counts from scene_marker_performers
  sex_scene_count(depth: Int, performer_id: ID): Int! # Resolver - scenes with sex markers
  oral_scene_count(depth: Int, performer_id: ID): Int! # Resolver - scenes with oral markers but no sex markers
  solo_scene_count(depth: Int, performer_id: ID): Int! # Resolver - scenes with solo markers but no sex/oral markers
  facial_scene_count(depth: Int, performer_id: ID): Int! # Resolver - scenes with facial markers
  unique_performer_count(depth: Int): Int! # Resolver - performers with only one scene in database and it's for this studio
}
