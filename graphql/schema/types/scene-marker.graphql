type SceneMarker {
  id: ID!
  scene: Scene!
  title: String!
  "The required start time of the marker (in seconds). Supports decimals."
  seconds: Float!
  "The optional end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  primary_tag: Tag!
  tags: [Tag!]!
  "Top performers associated with this marker (active/top role). Only performers assigned to the parent scene are selectable."
  top_performers: [Performer!]!
  "Bottom performers associated with this marker (passive/bottom role). Only performers assigned to the parent scene are selectable."
  bottom_performers: [Performer!]!
  "All performers associated with this marker (tops + bottoms, for backward compatibility)"
  performers: [Performer!]!
    @deprecated(reason: "Use top_performers and bottom_performers instead")
  created_at: Time!
  updated_at: Time!

  "The path to stream this marker"
  stream: String! # Resolver
  "The path to the preview image for this marker"
  preview: String! # Resolver
  "The path to the screenshot image for this marker"
  screenshot: String! # Resolver
}

input SceneMarkerCreateInput {
  title: String!
  "The required start time of the marker (in seconds). Supports decimals."
  seconds: Float!
  "The optional end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  scene_id: ID!
  primary_tag_id: ID!
  tag_ids: [ID!]
  "Top performer IDs (active/top role). Must be performers already assigned to the scene."
  top_performer_ids: [ID!]
  "Bottom performer IDs (passive/bottom role). Must be performers already assigned to the scene."
  bottom_performer_ids: [ID!]
  "Deprecated: Use top_performer_ids and bottom_performer_ids instead. For backward compatibility, these will be treated as top performers."
  performer_ids: [ID!]
}

input SceneMarkerUpdateInput {
  id: ID!
  title: String
  "The start time of the marker (in seconds). Supports decimals."
  seconds: Float
  "The end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  scene_id: ID
  primary_tag_id: ID
  tag_ids: [ID!]
  "Top performer IDs (active/top role). Must be performers already assigned to the scene."
  top_performer_ids: [ID!]
  "Bottom performer IDs (passive/bottom role). Must be performers already assigned to the scene."
  bottom_performer_ids: [ID!]
  "Deprecated: Use top_performer_ids and bottom_performer_ids instead."
  performer_ids: [ID!]
}

input BulkSceneMarkerUpdateInput {
  ids: [ID!]
  title: String
  primary_tag_id: ID
  tag_ids: BulkUpdateIds
}

type FindSceneMarkersResultType {
  count: Int!
  scene_markers: [SceneMarker!]!
}

type MarkerStringsResultType {
  count: Int!
  id: ID!
  title: String!
}
