type SceneMarker {
  id: ID!
  scene: Scene!
  title: String!
  "The required start time of the marker (in seconds). Supports decimals."
  seconds: Float!
  "The optional end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  primary_tag: Tag!
  tags: [Tag!]!
  "Giver performers associated with this marker (active/top role). Only performers assigned to the parent scene are selectable."
  giver_performers: [Performer!]!
  "Receiver performers associated with this marker (passive/bottom role). Only performers assigned to the parent scene are selectable."
  receiver_performers: [Performer!]!
  "All performers associated with this marker (givers + receivers, for backward compatibility)"
  performers: [Performer!]! @deprecated(reason: "Use giver_performers and receiver_performers instead")
  created_at: Time!
  updated_at: Time!

  "The path to stream this marker"
  stream: String! # Resolver
  "The path to the preview image for this marker"
  preview: String! # Resolver
  "The path to the screenshot image for this marker"
  screenshot: String! # Resolver
}

input SceneMarkerCreateInput {
  title: String!
  "The required start time of the marker (in seconds). Supports decimals."
  seconds: Float!
  "The optional end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  scene_id: ID!
  primary_tag_id: ID!
  tag_ids: [ID!]
  "Giver performer IDs (active/top role). Must be performers already assigned to the scene."
  giver_performer_ids: [ID!]
  "Receiver performer IDs (passive/bottom role). Must be performers already assigned to the scene."
  receiver_performer_ids: [ID!]
  "Deprecated: Use giver_performer_ids and receiver_performer_ids instead. For backward compatibility, these will be treated as giver performers."
  performer_ids: [ID!]
}

input SceneMarkerUpdateInput {
  id: ID!
  title: String
  "The start time of the marker (in seconds). Supports decimals."
  seconds: Float
  "The end time of the marker (in seconds). Supports decimals."
  end_seconds: Float
  scene_id: ID
  primary_tag_id: ID
  tag_ids: [ID!]
  "Giver performer IDs (active/top role). Must be performers already assigned to the scene."
  giver_performer_ids: [ID!]
  "Receiver performer IDs (passive/bottom role). Must be performers already assigned to the scene."
  receiver_performer_ids: [ID!]
  "Deprecated: Use giver_performer_ids and receiver_performer_ids instead."
  performer_ids: [ID!]
}

input BulkSceneMarkerUpdateInput {
  ids: [ID!]
  title: String
  primary_tag_id: ID
  tag_ids: BulkUpdateIds
}

type FindSceneMarkersResultType {
  count: Int!
  scene_markers: [SceneMarker!]!
}

type MarkerStringsResultType {
  count: Int!
  id: ID!
  title: String!
}
